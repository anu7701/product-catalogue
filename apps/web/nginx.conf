# Serves the built single-page app and forwards /api/ to the API container,
# so the browser only ever talks to one origin (no CORS, ARCHITECTURE §10.1).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Resolve the API container through Docker's DNS at request time, so Nginx
    # starts even if the API isn't up yet and follows it if it restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    # API: always proxied, never answered with the SPA's index.html (R-14).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace whatever the client sent with the address Nginx actually saw;
        # the API trusts exactly one proxy hop (TRUST_PROXY=1, R-07).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    # Built JS/CSS: a missing file is a real 404, never index.html served as a script.
    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The app: real files as-is, every other path gets index.html so deep
    # links and reloads work (GLB-04.FR2).
    location / {
        try_files $uri /index.html;

        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }
}
