# One command for the whole stack:  docker compose up --build
#   Site:     http://localhost:8080
#   Mailbox:  http://localhost:8025   (every enquiry email lands here)
#
# Every setting has a default below, so no .env file is needed. To change one,
# put it in a .env file next to this one (see .env.example) or set it in the
# shell, e.g. no internet / Fake Store down:  PRODUCT_SOURCE=fixture docker compose up --build

name: product-catalogue

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PRODUCT_SOURCE: ${PRODUCT_SOURCE:-fakestore}
      PRODUCT_SOURCE_URL: ${PRODUCT_SOURCE_URL:-https://fakestoreapi.com}
      FEATURED_PRODUCT_IDS: ${FEATURED_PRODUCT_IDS:-1,5,9,15,18}
      CATEGORY_TOP_RATED_COUNT: ${CATEGORY_TOP_RATED_COUNT:-3}
      SALES_INBOX: ${SALES_INBOX:-sales@example.com}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ENQUIRY_RATE_LIMIT_MAX: ${ENQUIRY_RATE_LIMIT_MAX:-5}
      ENQUIRY_RATE_LIMIT_WINDOW_MINUTES: ${ENQUIRY_RATE_LIMIT_WINDOW_MINUTES:-15}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Fixed for this setup: reachable from the web container (port not
      # published to the host), behind exactly one proxy (Nginx, R-07).
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: 1
    depends_on:
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_STORE_NAME: ${VITE_STORE_NAME:-Catalogue}
    ports:
      # Local machine only.
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    # Local test mailbox (CFG-03): captures every email, nothing is delivered.
    image: axllent/mailpit:v1.34.0
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
      # SMTP, for running the API outside Docker with `npm run dev:api`.
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
    environment:
      MP_MAX_MESSAGES: 500
    restart: unless-stopped
